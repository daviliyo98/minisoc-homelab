# homelab-portal: catálogo de servicios del homelab con estado de salud.
#
# Red host (network_mode: host) por un motivo concreto: Prometheus y Unbound escuchan
# en el LOOPBACK del host (127.0.0.1:9090 y 127.0.0.1:5335), y el loopback del host
# está aislado del de los contenedores: ni por host.docker.internal ni por su propio
# 127.0.0.1 se llegan. En red host sí.
#
# OJO: en red host no hay `ports:`; la exposición la controla uvicorn (BIND_HOST).
# Con 0.0.0.0 el portal queda en la LAN y en el tailnet, y solo lo protege la clave.
services:
  homelab-portal:
    build: .
    container_name: homelab-portal
    network_mode: host
    environment:
      PORTAL_USER: "${PORTAL_USER:-admin}"
      PORTAL_PASSWORD: "${PORTAL_PASSWORD:-}"
      # Escucha en todas las interfaces: accesible por la IP de casa y por el tailnet.
      # La protección es la contraseña de PORTAL_PASSWORD. Poner aquí una IP concreta
      # (p.ej. 100.114.119.53) lo restringiría a esa sola vía.
      BIND_HOST: "${BIND_HOST:-0.0.0.0}"
      # OJO: el 8080 NO sirve en red host con 0.0.0.0. crowdsec ya ocupa
      # 127.0.0.1:8080 en el host y atar a 0.0.0.0:8080 falla con EADDRINUSE.
      # Por eso el 8090.
      BIND_PORT: "${BIND_PORT:-8090}"
      # Caducidad de la caché de sondas. El portal se mide a sí mismo: con las cinco
      # sondas simultáneas, Grafana llegó a devolver 503 en la microSD. Ver app/health.py.
      PORTAL_HEALTH_TTL: "${PORTAL_HEALTH_TTL:-20}"
      # Historial (app/history.py): una muestra por servicio cada PORTAL_POLL
      # segundos, guardada PORTAL_RETENCION_DIAS días. Con 5 servicios y 7 días son
      # ~50 000 filas: unos pocos MB en la microSD.
      PORTAL_POLL: "${PORTAL_POLL:-60}"
      PORTAL_RETENCION_DIAS: "${PORTAL_RETENCION_DIAS:-7}"
      # Hora local sin instalar tzdata en la imagen slim: formato POSIX de Madrid.
      TZ: "${TZ_POSIX:-CET-1CEST,M3.5.0,M10.5.0/3}"
      # Ubicación para la sección Entorno. Va en .env (no en services.yaml) porque
      # son las coordenadas de casa y el repositorio es público. Vacías = Granada.
      ENTORNO_NOMBRE: "${ENTORNO_NOMBRE:-}"
      ENTORNO_LAT: "${ENTORNO_LAT:-}"
      ENTORNO_LON: "${ENTORNO_LON:-}"
      ENTORNO_RADIO_KM: "${ENTORNO_RADIO_KM:-}"
      # Dispositivos: la actividad DNS de cada aparato sale de la API de Pi-hole v6.
      # Mejor una contraseña de aplicación de Pi-hole que la de administrador.
      PIHOLE_API: "${PIHOLE_API:-http://127.0.0.1/api}"
      PIHOLE_PASSWORD: "${PIHOLE_PASSWORD:-}"
    dns:
      - 127.0.0.1     # en red host el resolver es el del host: su Pi-hole
    volumes:
      - ./services.yaml:/app/services.yaml:ro   # el catálogo se edita sin reconstruir
      # Único sitio escribible del contenedor (read_only: true): la SQLite del historial.
      - portal-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    restart: unless-stopped

volumes:
  portal-data:
