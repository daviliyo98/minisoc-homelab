# Inventario de aparatos para la sección Dispositivos del portal.
#
# Cópialo a privado/dispositivos.yaml (privado/ está en .gitignore: el repo es
# público y no debe listar lo que hay en tu casa):
#
#   mkdir -p privado && cp dispositivos.example.yaml privado/dispositivos.yaml
#
# La MAC la ves en la propia sección Dispositivos ("Sin identificar"), en
# Pi-hole > Network o en el router. Los cambios se aplican en el siguiente
# refresco (1 min), sin reiniciar el contenedor.

dispositivos:
  - mac: "aa:bb:cc:dd:ee:ff"
    nombre: "Robot aspirador"
    tipo: "Xiaomi T12"
    nota: "Conectado a la wifi de 2,4 GHz"

  # - mac: "11:22:33:44:55:66"
  #   nombre: "Alexa salón"
  #   tipo: "Amazon Echo"
