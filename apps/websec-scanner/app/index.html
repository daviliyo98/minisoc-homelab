<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>websec-scanner · MINISOC</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --border:#2a3550;
    --text:#e6ebf5; --muted:#8b97b2; --accent:#4f8cff;
    --alta:#ff5a5a; --media:#ff9f43; --baja:#ffd94a; --ok:#3ddc84;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:32px 16px 64px}
  header h1{margin:0 0 4px;font-size:1.5rem}
  header p{margin:0 0 24px;color:var(--muted);font-size:.9rem}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
        padding:20px;margin-bottom:20px}
  label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 6px}
  input{width:100%;padding:11px 13px;background:var(--panel2);border:1px solid var(--border);
        border-radius:8px;color:var(--text);font-size:.95rem}
  input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1;min-width:200px}
  button{margin-top:16px;width:100%;padding:12px;background:var(--accent);color:#fff;
         border:0;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .hidden{display:none}
  /* Pestañas Web / Correo */
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;margin-top:0;background:var(--panel);border:1px solid var(--border);color:var(--muted);
       font-size:.92rem;padding:10px;border-radius:8px;font-weight:600}
  .tab.active{background:var(--panel2);color:var(--text);border-color:var(--accent)}
  .score{display:flex;align-items:center;gap:20px;margin-bottom:16px}
  .score .num{font-size:3rem;font-weight:800;line-height:1}
  .meta{color:var(--muted);font-size:.85rem}
  .meta b{color:var(--text)}
  .verdict{border:1px solid;border-radius:8px;padding:11px 14px;margin:0 0 14px;
           font-weight:600;font-size:.9rem}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;
         font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#101520}
  .b-alta{background:var(--alta)} .b-media{background:var(--media)} .b-baja{background:var(--baja)}
  .b-info{background:var(--muted)}
  .logbox{margin-top:10px;background:#0a0e17;border:1px solid var(--border);border-radius:8px;
    padding:9px 11px;max-height:230px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  .logline{color:var(--muted);font-size:.78rem;line-height:1.5;white-space:pre-wrap;word-break:break-all}
  .finding{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
  .finding:first-child{border-top:0}
  .finding .body{flex:1}
  .finding .title{font-weight:600}
  .finding .detail{color:var(--muted);font-size:.85rem;margin-top:2px}
  .finding .fix{font-size:.82rem;margin-top:5px}
  .finding .fix b{color:var(--ok)}
  .err{color:var(--alta);font-weight:600}
  .sectxt{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
          padding:12px 14px;margin:10px 0 16px;white-space:pre-wrap;word-break:break-word;
          font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;color:var(--text)}
  .sectxt a{color:var(--accent)}
  .tag-ok{color:var(--ok);font-weight:700}
  .sectitle{font-weight:700;font-size:.95rem;margin:18px 0 8px}
  .checks{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:6px}
  .chk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--border);font-size:.86rem}
  .chk:first-child{border-top:0}
  .chk .st{width:16px;text-align:center;font-weight:800;flex:none}
  .chk .nm{flex:1}
  .chk .dt{color:var(--muted);font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace}
  .st-ok{color:var(--ok)} .st-falta{color:var(--alta)} .st-aviso{color:var(--media)} .st-info{color:var(--muted)}
  .foot{color:var(--muted);font-size:.78rem;text-align:center;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛡️ websec-scanner</h1>
    <p>Análisis pasivo de postura de seguridad · MINISOC homelab</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="web">🌐 Web</button>
    <button class="tab" data-tab="mail">✉️ Correo</button>
    <button class="tab" data-tab="activo">⚡ Activo</button>
    <button class="tab" data-tab="zap">🕷️ ZAP</button>
  </div>

  <div class="card">
    <div class="row">
      <div id="url-group">
        <label for="url">URL a analizar</label>
        <input id="url" type="text" placeholder="https://ejemplo.com" autocomplete="off">
      </div>
      <div id="domain-group" class="hidden">
        <label for="domain">Dominio a comprobar (suplantación de correo)</label>
        <input id="domain" type="text" placeholder="ejemplo.com" autocomplete="off">
      </div>
      <div>
        <label for="key">Clave de API</label>
        <input id="key" type="password" placeholder="x-api-key" autocomplete="off">
      </div>
    </div>
    <div id="authz-group" class="hidden" style="margin-top:12px">
      <label style="display:flex;gap:9px;align-items:flex-start;cursor:pointer;color:var(--text);font-size:.85rem">
        <input id="authz" type="checkbox" style="width:auto;margin-top:3px">
        <span>Confirmo que tengo <b>autorización por escrito</b> del titular para escanear activamente este objetivo. El escaneo activo envía peticiones reales al servidor.</span>
      </label>
    </div>
    <div id="zap-opts" class="hidden" style="margin-top:10px">
      <label style="display:flex;gap:9px;align-items:flex-start;cursor:pointer;color:var(--text);font-size:.85rem">
        <input id="zap-activo" type="checkbox" style="width:auto;margin-top:3px">
        <span>Escaneo <b>activo</b> de inyección (SQLi, XSS…). Más potente y más lento; <b>más intrusivo</b>. Sin marcar, ZAP solo rastrea y analiza en modo pasivo.</span>
      </label>
    </div>
    <button id="go">Analizar web</button>
  </div>

  <div id="result" class="card hidden"></div>

  <p class="foot">Solo sistemas propios o con autorización explícita. Diagnóstico pasivo de la exposición externa: no sondea ni ataca, y <b>no sustituye</b> una auditoría interna del servidor ni un test de intrusión (pentest).</p>
</div>

<script>
const $ = s => document.querySelector(s);
const sevClass = s => ({alta:"b-alta",media:"b-media",baja:"b-baja",informativo:"b-info"}[s] || "b-baja");
const scoreColor = n => n>=80?"var(--ok)":n>=50?"var(--media)":"var(--alta)";
let tab = "web";

// Recuerda la clave en el navegador para no reescribirla cada vez
try { $("#key").value = localStorage.getItem("websec_key") || ""; } catch(e){}

// --- Pestañas ---
document.querySelectorAll(".tab").forEach(b=>{
  b.addEventListener("click", ()=>{
    tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===b));
    const needsUrl = (tab==="web" || tab==="activo" || tab==="zap");
    const needsAuthz = (tab==="activo" || tab==="zap");
    $("#url-group").classList.toggle("hidden", !needsUrl);
    $("#domain-group").classList.toggle("hidden", tab!=="mail");
    $("#authz-group").classList.toggle("hidden", !needsAuthz);
    $("#zap-opts").classList.toggle("hidden", tab!=="zap");
    $("#go").textContent = tab==="mail" ? "Analizar correo"
      : (tab==="activo" ? "Escanear (activo)" : (tab==="zap" ? "Escanear con ZAP" : "Analizar web"));
    $("#result").classList.add("hidden");
  });
});

function sumFindings(h){ return h.map(f=>
  '<div class="finding"><span class="badge '+sevClass(f.severidad)+'">'+f.severidad+'</span>'+
  '<div class="body"><div class="title">'+f.titulo+'</div>'+
  '<div class="detail">'+f.detalle+'</div>'+
  '<div class="fix"><b>Solución:</b> '+f.remediacion+'</div></div></div>').join("");
}
const stSym = e => ({ok:"✓",falta:"✗",aviso:"◐",info:"·"}[e] || "·");
function sumChecks(list){
  if(!list || !list.length) return "";
  return '<div class="sectitle">Comprobaciones</div><div class="checks">'+
    list.map(c=>'<div class="chk"><span class="st st-'+c.estado+'">'+stSym(c.estado)+'</span>'+
      '<span class="nm">'+c.nombre+'</span><span class="dt">'+(c.detalle||"")+'</span></div>').join("")+
    '</div>';
}
function scoreHead(d){
  return '<div class="score"><div class="num" style="color:'+scoreColor(d.puntuacion)+'">'+d.puntuacion+'</div>'+
    '<div><div style="font-weight:600">'+d.objetivo+'</div>'+
    '<div class="meta">'+d.resumen.altas+' altas · '+d.resumen.medias+' medias · '+d.resumen.bajas+' bajas'+
    (d.resumen.informativos ? ' · '+d.resumen.informativos+' info' : '')+'</div></div></div>';
}

// Escaneo activo en 2º plano: sondea el estado del trabajo hasta que termina.
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function logBox(log){
  if(!log || !log.length) return "";
  const lineas = log.slice(-14).map(l=>'<div class="logline">'+esc(l)+'</div>').join("");
  return '<div class="logbox">'+lineas+'</div>';
}

async function pollActive(jobId, key){
  const box = $("#result");
  if(!jobId){ box.innerHTML='<p class="err">No se recibió el identificador del escaneo.</p>'; return; }
  let secs = 0;
  while(true){
    await new Promise(r=>setTimeout(r, 3000));
    secs += 3;
    if(secs > 900){ box.innerHTML='<p class="err">El escaneo tardó demasiado (más de 15 min).</p>'; return; }
    let r, data;
    try{
      r = await fetch("/scan-status/"+jobId, {headers:{"x-api-key":key}});
      data = await r.json();
    }catch(e){ box.innerHTML='<p class="err">Se perdió la conexión con la API.</p>'; return; }
    if(!r.ok){ box.innerHTML='<p class="err">Error '+r.status+': '+((data&&data.detail)||"fallo")+'</p>'; return; }
    if(data.status==="running"){
      box.innerHTML='<span class="meta">🕷️ Escaneando '+esc(data.objetivo||"")+'… ('+secs+'s)</span>'+logBox(data.log);
      continue;
    }
    if(data.status==="error"){
      box.innerHTML='<p class="err">El escaneo falló: '+esc(data.error||"error")+'</p>'+logBox(data.log);
      return;
    }
    if(data.status==="done"){ renderActive(data.result); return; }
    box.innerHTML='<p class="err">Estado desconocido: '+esc(data.status)+'</p>'; return;
  }
}

async function run(){
  const key = $("#key").value.trim();
  const box = $("#result");
  const target = (tab==="mail") ? $("#domain").value.trim() : $("#url").value.trim();
  if(!target) return;
  const esSegundoPlano = (tab==="activo" || tab==="zap");
  if(esSegundoPlano && !$("#authz").checked){ alert("Marca la casilla de autorización para escanear este objetivo."); return; }
  try { localStorage.setItem("websec_key", key); } catch(e){}

  $("#go").disabled = true; $("#go").textContent = esSegundoPlano ? "Escaneando (puede tardar)…" : "Analizando…";
  box.classList.remove("hidden");
  box.innerHTML = '<span class="meta">Analizando ' + target + '…</span>';

  let endpoint, payload;
  if(tab==="web"){ endpoint="/scan"; payload={url: target}; }
  else if(tab==="mail"){ endpoint="/scan-mail"; payload={domain: target}; }
  else if(tab==="activo"){ endpoint="/scan-active"; payload={url: target, autorizo: $("#authz").checked}; }
  else { endpoint="/scan-zap"; payload={url: target, autorizo: $("#authz").checked, activo: $("#zap-activo").checked}; }
  try{
    const r = await fetch(endpoint, {
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":key},
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    if(!r.ok){
      let det = data && data.detail;
      if(Array.isArray(det)) det = det.map(e=>e.msg||JSON.stringify(e)).join("; ");
      else if(det && typeof det !== "string") det = JSON.stringify(det);
      box.innerHTML = '<p class="err">Error '+r.status+': '+(det||"fallo")+'</p>'; return;
    }
    if(tab==="web") renderWeb(data);
    else if(tab==="mail") renderMail(data);
    else { pollActive(data.job_id, key); return; }   // activo/zap: trabajo en 2º plano
  }catch(e){
    box.innerHTML = '<p class="err">No se pudo contactar con la API.</p>';
  }finally{
    $("#go").disabled = false;
    $("#go").textContent = tab==="mail" ? "Analizar correo"
      : (tab==="activo" ? "Escanear (activo)" : (tab==="zap" ? "Escanear con ZAP" : "Analizar web"));
  }
}

function renderWeb(d){
  const tls = d.tls||{}, st = d.security_txt||{};
  let h = scoreHead(d);
  h += '<div class="meta" style="margin-bottom:14px">';
  if(tls.ok){ h += 'TLS: <b>'+tls.version+'</b> · caduca en <b>'+tls.dias_para_caducar+' días</b> · emisor <b>'+(tls.emisor||"?")+'</b><br>'; }
  if(st.existe){
    h += 'security.txt: <span class="tag-ok">sí ('+st.ruta+')</span> — esta web acepta reportes de seguridad</div>';
    const esc = (st.contenido||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
    const linked = esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    h += '<div class="sectxt">'+linked+'</div>';
  } else {
    h += 'security.txt: <b>no</b> — sin canal público de reporte</div>';
  }
  h += sumChecks(d.comprobaciones);
  if((d.hallazgos||[]).length){ h += '<div class="sectitle">Hallazgos y mejoras</div>'; }
  h += sumFindings(d.hallazgos||[]);
  if(!(d.hallazgos||[]).length){ h += '<p style="color:var(--ok)">Sin hallazgos. Buena configuración.</p>'; }
  $("#result").innerHTML = h;
}

function renderMail(d){
  const spf=d.spf||{}, dm=d.dmarc||{}, dk=d.dkim||{};
  let h = scoreHead(d);
  const vc = d.suplantable ? 'var(--alta)' : 'var(--ok)';
  h += '<div class="verdict" style="border-color:'+vc+';color:'+vc+'">'+(d.suplantable?'⚠ ':'✓ ')+d.veredicto+'</div>';
  h += '<div class="meta" style="margin-bottom:14px">';
  h += 'SPF: <b>'+(spf.presente?('sí ('+(spf.cualificador||'sin all')+(spf.delegado_en?', vía '+spf.delegado_en:'')+')'):'no')+'</b> · ';
  h += 'DMARC: <b>'+(dm.presente?('p='+dm.politica):'no')+'</b> · ';
  h += 'DKIM: <b>'+(dk.detectado?('sí ('+(dk.selectores||[]).join(", ")+')'):'no detectado')+'</b><br>';
  h += 'Recibe correo (MX): <b>'+(d.recibe_correo?'sí':'no')+'</b></div>';
  h += sumChecks(d.comprobaciones);
  if((d.hallazgos||[]).length){ h += '<div class="sectitle">Hallazgos y mejoras</div>'; }
  h += sumFindings(d.hallazgos||[]);
  if(!(d.hallazgos||[]).length){ h += '<p style="color:var(--ok)">Sin hallazgos. Buena configuración de correo.</p>'; }
  $("#result").innerHTML = h;
}

function renderActive(d){
  let h = scoreHead(d);
  const esZap = d.motor === "zap";
  const activoZap = d.modo === "zap-activo";
  let etiqueta, vacio;
  if(esZap && activoZap){
    etiqueta = '🕷️ Escaneo ACTIVO con OWASP ZAP (inyección) — solo objetivos autorizados';
    vacio = 'ZAP no detectó vulnerabilidades de inyección en los puntos analizados.';
  } else if(esZap){
    etiqueta = '🕷️ Escaneo con OWASP ZAP (spider + pasivo) — solo objetivos autorizados';
    vacio = 'ZAP no detectó avisos en el análisis pasivo.';
  } else {
    etiqueta = '⚡ Escaneo ACTIVO con Nuclei — solo objetivos autorizados';
    vacio = 'Sin vulnerabilidades conocidas detectadas por Nuclei.';
  }
  h += '<div class="verdict" style="border-color:var(--media);color:var(--media)">'+etiqueta+'</div>';

  const todos = d.hallazgos || [];
  const fallos = todos.filter(f => f.severidad !== "informativo");
  const infos  = todos.filter(f => f.severidad === "informativo");

  if(fallos.length){ h += '<div class="sectitle">Hallazgos</div>' + sumFindings(fallos); }
  else { h += '<p style="color:var(--ok)">'+vacio+'</p>'; }

  if(infos.length){
    h += '<div class="sectitle">Informativo — tecnología detectada (no son fallos)</div>';
    h += sumFindings(infos);
  }
  if(d.aviso){ h += '<p class="meta" style="margin-top:12px">'+d.aviso+'</p>'; }
  $("#result").innerHTML = h;
}

$("#go").addEventListener("click", run);
$("#url").addEventListener("keydown", e=>{ if(e.key==="Enter") run(); });
$("#domain").addEventListener("keydown", e=>{ if(e.key==="Enter") run(); });
</script>
</body>
</html>
