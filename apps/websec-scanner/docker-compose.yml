# websec-scanner: analizador pasivo de postura de seguridad web.
# Publicado solo en la LAN; requiere API_KEY (ver .env.example).
services:
  websec-scanner:
    build: .
    container_name: websec-scanner
    dns:
      - 172.17.0.1   # resuelve a través del Pi-hole del host
    environment:
      API_KEY: "${API_KEY}"
      # Modo activo (Nuclei): 0 = desactivado (por defecto), 1 = activado.
      ACTIVE_SCAN_ENABLED: "${ACTIVE_SCAN_ENABLED:-0}"
    ports:
      - "192.168.1.20:8001:8000"   # accesible solo desde tu red, puerto 8001
    read_only: true                # sistema de archivos de solo lectura
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # La red IPv6 de este entorno no es alcanzable (ver nota en checks.py). El scanner
    # pasivo ya fuerza IPv4; aquí lo desactivamos para todo el contenedor, de modo que
    # Nuclei no intente IPv6 y falle con timeouts ("port closed or filtered").
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    mem_limit: 1536m               # holgura para Nuclei (6600+ plantillas); la Pi tiene 8 GB
    restart: unless-stopped
