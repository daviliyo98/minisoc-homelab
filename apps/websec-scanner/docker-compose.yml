# websec-scanner: analizador de postura de seguridad web.
# Publicado solo en la LAN; requiere API_KEY (ver .env.example).
services:
  websec-scanner:
    build: .
    container_name: websec-scanner
    dns:
      - 172.17.0.1   # resuelve a través del Pi-hole del host
    environment:
      API_KEY: "${API_KEY}"
      # Modo activo (Nuclei): 0 = desactivado (por defecto), 1 = activado.
      ACTIVE_SCAN_ENABLED: "${ACTIVE_SCAN_ENABLED:-0}"
      # Integración con OWASP ZAP (spider + pasivo, y activo tras el triple candado).
      ZAP_ENABLED: "${ZAP_ENABLED:-0}"
      ZAP_API_KEY: "${ZAP_API_KEY:-}"
      ZAP_BASE: "http://zap:8080"
      # Claves con roles (nombre:rol:clave, separadas por comas). API_KEY sigue valiendo como admin.
      API_KEYS: "${API_KEYS:-}"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-60}"
      JOBS_MAX_CONCURRENT: "${JOBS_MAX_CONCURRENT:-1}"
      REQUIRE_VERIFIED_DOMAIN: "${REQUIRE_VERIFIED_DOMAIN:-0}"
      # Monitorización y alertas
      MONITOR_ENABLED: "${MONITOR_ENABLED:-1}"
      ALERT_MIN_CVSS: "${ALERT_MIN_CVSS:-4.0}"
      ALERT_CERT_DAYS: "${ALERT_CERT_DAYS:-21}"
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    ports:
      - "0.0.0.0:8001:8000"   # LAN + tailnet (Tailscale); el API_KEY protege la API
    read_only: true                # sistema de archivos de solo lectura
    tmpfs:
      - /tmp
    volumes:
      - websec-data:/data          # SQLite: historial, activos, auditoría (lo único escribible)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # La red IPv6 de este entorno no es alcanzable (ver nota en checks.py). El scanner
    # pasivo ya fuerza IPv4; aquí lo desactivamos para todo el contenedor, de modo que
    # Nuclei no intente IPv6 y falle con timeouts ("port closed or filtered").
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    mem_limit: 1536m               # holgura para Nuclei (6600+ plantillas); la Pi tiene 8 GB
    restart: unless-stopped
    # OJO: NO ponemos depends_on: zap. ZAP está en un profile opcional y el
    # scanner lo detecta en caliente (zap_disponible). Un depends_on a un
    # servicio desactivado por profile rompe el compose ("undefined service").

  # OWASP ZAP en modo demonio. NO se publica ningún puerto al host: solo es
  # accesible desde la red interna de Docker (el scanner le habla por su nombre
  # de servicio, http://zap:8080). Así ZAP no queda expuesto a la LAN ni a
  # internet. El perfil 'zap' lo mantiene apagado salvo que lo pidas
  # explícitamente (docker compose --profile zap up).
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: websec-zap
    profiles: ["zap"]
    # init: zap.sh hace `exec java`, así que sin esto Java es el PID 1 del
    # contenedor y "adopta" los procesos huérfanos del Firefox headless del
    # spider sin recogerlos nunca: 127 zombis en 9 días (HL-013). Con init: true,
    # tini es el PID 1 y los recoge.
    init: true
    # api.addrs.*: permite que el scanner (otra IP de la red Docker) use la API.
    # api.key: clave obligatoria para toda llamada a la API (ver .env.example).
    # -Xmx1g va AQUÍ, como argumento de zap.sh: zap.sh calcula su propio -Xmx
    # (1/4 de la RAM del host, porque sin cgroup de memoria no ve el límite del
    # contenedor, HL-004) y la línea de comandos gana a JAVA_TOOL_OPTIONS.
    command: >
      zap.sh -Xmx1g -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY:-}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config database.recoverylog=false
    expose:
      - "8080"                     # visible solo dentro de la red de Docker
    security_opt:
      - no-new-privileges:true
    # El límite del contenedor debe quedar POR ENCIMA del heap (-Xmx) más el
    # Firefox del spider, o el kernel mata ZAP por OOM (se vio como ReadTimeout
    # al recoger alertas en sitios con páginas grandes). Si con -Xmx1g ZAP da
    # OutOfMemoryError en un sitio grande, sube a -Xmx1536m. Nota: mem_limit lo
    # ignora este kernel hasta aplicar HL-004.
    mem_limit: 2560m
    # Sin restart: ZAP es una herramienta, no un servicio. Con unless-stopped,
    # arrancarlo una vez lo dejaba encendido para siempre (también tras reiniciar
    # la Pi). Se levanta para escanear y se apaga después:
    #   docker compose --profile zap up -d zap   ...   docker compose stop zap
    restart: "no"

volumes:
  websec-data:
